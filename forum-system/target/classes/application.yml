# Spring 全局配置
spring:
  application:
    name: 论坛系统 # 项⽬名
  output:
    ansi:
      enabled: ALWAYS # 控制台输出彩⾊⽇志
  datasource:
    driver-class-name: com.mysql.jdbc.Driver   # 注意：5.1.x 驱动类名没有 .cj.
    # 数据库连接串
    url: jdbc:mysql://127.0.0.1:3308/forum_db?useUnicode=true&characterEncoding=utf8&useSSL=false
    username: root
    password: '1308670712.'

server:
  # 自定义服务端口号
  port: 27271

# 日志配置
logging:
  pattern:
    # 日志显示格式
    dateformat: yyyy-MM-dd HH:mm:ss
  level:
    # root 日志级别设置为 info
    root: info
    # 设置 com.me.forum 包下的日志级别为 debug
    com.me.forum: debug
  file:
    # 设置日志文件的存储路径
    path: C:/JAVA/log/forum_log

# mybatis 相关配置，单独配置，顶格写
mybatis:
  mapper-locations: classpath:mapper/**/*.xml # 指定 xxxMapper.xml的扫描路径